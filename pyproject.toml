[project]
name = "drone-city-detector"
version = "0.1.0"
description = "Drone object detection for urban environments."
authors = [{name = "Marc Nunez", email = "marcnunezubach@gmail.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.13"

dependencies = [
    "ultralytics==8.3.40",
    "supervision==0.21.0",
    "matplotlib==3.8.4",
    "clip==0.1.0",
    "mpmath==1.3.0",
    "sympy==1.14.0",
    "transformers==5.3.0",
    "timm==1.0.25"
]

[project.urls]
Homepage = "https://github.com/marcnunez/drone-city-detector"

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
